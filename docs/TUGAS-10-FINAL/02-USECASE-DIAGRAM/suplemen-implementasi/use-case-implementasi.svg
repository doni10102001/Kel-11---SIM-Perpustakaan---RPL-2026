<text x="318" y="1140" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#78350f" text-anchor="start" font-weight="normal"  dominant-baseline="middle">CATATAN: Suplemen ini TIDAK menggantikan Use Case Diagram asli (docs/uml/Use Case - SIM Perpustakaan.drawio.png). Disusun dari rute &amp; controller aktual.</text>
<text x="318" y="1164" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#78350f" text-anchor="start" font-weight="normal"  dominant-baseline="middle">Ditambahkan vs. diagram asli: Verifikasi Booking, Realisasi Booking, Lihat Status Booking, Batalkan Booking, Ubah Kata Sandi, Kelola Akses Login Anggota, Kelola Eksemplar,</text>
<text x="318" y="1188" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#78350f" text-anchor="start" font-weight="normal"  dominant-baseline="middle">dan proses otomatis kedaluwarsa booking 48 jam. Peran final hanya Admin dan Anggota (Petugas SRS v1.1 dijalankan oleh Admin). Admin juga memiliki halaman</text>
<text x="318" y="1212" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#78350f" text-anchor="start" font-weight="normal"  dominant-baseline="middle">Ubah Kata Sandi (/admin/kata-sandi) — asosiasinya tidak digambar agar garis tidak bersilangan. Garis solid = asosiasi aktor; panah putus-putus = «include» / «extend».</text>
