<text x="48" y="854" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#78350f" text-anchor="start" font-weight="normal" dominant-baseline="middle">Rancangan produksi (Nginx + PHP-FPM 8.4 + MySQL 8.4 di Linux, HTTPS) adalah USULAN pada Deployment Diagram asli: docs/uml/Development Diagram.drawio.png (TBD-10).</text>
<text x="48" y="880" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#78350f" text-anchor="start" font-weight="normal" dominant-baseline="middle">Instance MySQL lokal dipakai bersama proyek lain di mesin pengembang; aplikasi hanya memakai dua skema di atas dengan akun basis data terpisah.</text>
